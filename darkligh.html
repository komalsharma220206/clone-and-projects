<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
        }
        .black{
            background-color: black;
            color:white;
        }
        .white{
            background-color: white;
            color: black;
            border-radius: 50px;
            height: 50px;
            width: 50px;
            padding:0px;
        }
        .box{
            display: flex;
        }
        .box1{
            width: 100vh;
            height:50px;
            border:2px solid black;
            text-align: center;
            padding: 15px;
            box-sizing: border-box;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serifz;
            font-weight: 800;
            border: none;
            flex-grow: 1;
        }
        .cont{
            display: flex;
        }
        .box3{
            width:200px;
            height:200px;
            box-shadow: -13px 12px 16px 1px black;
            margin:10vh;
            animation: komal 1s ease-in-out infinite forwards;
            flex-grow: 1;
        }
        @keyframes komal {
             0%{
        transform: translateY(0px);
    }
    50%{
        transform: translateY(-20px);
    }
    100%{
        transform: translateY(0px);
    }
        }
    .back{
        margin:10vh;
    }
    </style>
</head>
<body>
    <div class="box">
        <div class="box1 ">HOME</div>
        <div class="box1 ">ABOUT</div>
        <div class="box1 ">CONTACT</div>
        <div class="box1 ">DESCRIPTION</div>
        <div class="box1 ">
        <button class="black white">
    </button>
</div>
    </div>
    <div class="cont">
        <div class="box3 b1 ">
          <img src="radhaparthsarthi.jpeg" width="135px" height="200px">
    </div>
    <div class="box3 b2 back">
         <img src="rk.jpeg" width="135px" height="200px">
    </div>
    <div class="box3 b3">
         <img src="rk1.jpeg" width="135px" height="200px">
    </div>
    <div class="box3 b4 back">
         <img src="rk2.jpeg" width="135px" height="200px">
    </div>
    <div class="box3 b5">
         <img src="rk3.jpeg" width="135px" height="200px">
    </div>
    </div>
    
    <script src="darklight.js"></script>
</body>
